server:
  port: ${ORDER_SERVER_PORT:8083}
spring:
  application:
    name: order-service
  datasource:
    url: ${ORDER_DB_URL:jdbc:mysql://localhost:3306/order_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${ORDER_DB_USERNAME:root}
    password: ${ORDER_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:car-sales-auth}
  customer-service:
    base-url: ${CUSTOMER_SERVICE_URL:http://localhost:8082}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  internal-key: ${ORDER_INTERNAL_KEY:local-internal-key}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
