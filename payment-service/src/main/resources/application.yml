server:
  port: ${PAYMENT_SERVER_PORT:8086}

spring:
  application:
    name: payment-service
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:mysql://localhost:3306/payment_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${PAYMENT_DB_USERNAME:root}
    password: ${PAYMENT_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-only-secret-change-me-32bytes!}
    issuer: ${JWT_ISSUER:car-sales-auth}
  order-service:
    base-url: ${ORDER_SERVICE_URL:http://localhost:8083}
    internal-key: ${ORDER_INTERNAL_KEY:local-internal-key}
  customer-service:
    base-url: ${CUSTOMER_SERVICE_URL:http://localhost:8082}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
