server:
  port: ${CUSTOMER_SERVER_PORT:8082}
spring:
  application:
    name: customer-service
  datasource:
    url: ${CUSTOMER_DB_URL:jdbc:mysql://localhost:3306/customer_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${CUSTOMER_DB_USERNAME:root}
    password: ${CUSTOMER_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:car-sales-auth}
  auth-service:
    base-url: ${AUTH_SERVICE_URL:http://localhost:8081}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
