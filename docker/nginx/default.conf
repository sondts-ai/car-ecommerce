upstream auth_service { server auth-service:8081; }
upstream customer_service { server customer-service:8082; }
upstream order_service { server order-service:8083; }
upstream car_service { server car-service:8084; }
upstream inventory_service { server inventory-service:8085; }
upstream payment_service { server payment-service:8086; }

server {
    listen 80;

    # Dùng cho Docker/Jenkins healthcheck, không phụ thuộc backend.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # --- Nội bộ service-to-service: không bao giờ expose qua gateway ---
    location /api/v1/internal/ {
        return 404;
    }
    location /api/v1/me/internal/ {
        return 404;
    }

    location /api/v1/auth/ {
        proxy_pass http://auth_service/api/v1/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/v1/customers/ {
        proxy_pass http://customer_service/api/v1/customers/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }
    location /api/v1/test-drives {
        proxy_pass http://customer_service/api/v1/test-drives;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }
    location /api/v1/me/ {
        proxy_pass http://order_service/api/v1/me/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }
    location /api/v1/payments/ {
        proxy_pass http://payment_service/api/v1/payments/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    # --- Admin API: order-service (doanh thu, doanh số) ---
    location /api/v1/admin/orders {
        proxy_pass http://order_service/api/v1/admin/orders;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }
    location /api/v1/admin/test-drives {
        proxy_pass http://customer_service/api/v1/admin/test-drives;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    # --- Admin API: car-service (danh mục) ---
    location /api/v1/admin/brands {
        proxy_pass http://car_service/api/v1/admin/brands;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }
    location /api/v1/admin/categories {
        proxy_pass http://car_service/api/v1/admin/categories;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }
    location /api/v1/admin/car-models {
        proxy_pass http://car_service/api/v1/admin/car-models;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }
    location /api/v1/admin/versions {
        proxy_pass http://car_service/api/v1/admin/versions;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    # --- Admin API: inventory-service (xe cụ thể, chi nhánh, ảnh, giấy tờ) ---
    location /api/v1/admin/vehicles {
        proxy_pass http://inventory_service/api/v1/admin/vehicles;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }
    location /api/v1/admin/vehicle-images {
        proxy_pass http://inventory_service/api/v1/admin/vehicle-images;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }
    location /api/v1/admin/vehicle-documents {
        proxy_pass http://inventory_service/api/v1/admin/vehicle-documents;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }
    location /api/v1/admin/branches {
        proxy_pass http://inventory_service/api/v1/admin/branches;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }
    location /api/v1/admin/stats {
        proxy_pass http://inventory_service/api/v1/admin/stats;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    # --- Public catalog: giữ route cũ; car-service hiện chỉ có admin/internal ---
    location /api/v1/cars {
        proxy_pass http://car_service/api/v1/cars;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }
}
