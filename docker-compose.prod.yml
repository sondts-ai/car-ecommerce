# Overlay cho môi trường cloud/production:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build
#
# Image được build & push bởi Jenkins với tag ${IMAGE_TAG}; compose chỉ pull,
# không build trên server. Mọi biến nhạy cảm lấy từ .env (Jenkins ghi ra server)
# hoặc từ secret manager của cloud.
services:
  mysql:
    pull_policy: always
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  auth-service:
    pull_policy: always
    restart: always
    logging:
      driver: json-file
