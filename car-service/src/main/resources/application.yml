server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: car-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/car_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=utf8}
    username: ${DB_USERNAME:car_app}
    password: ${DB_PASSWORD:CarApp@123}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    # Phải trùng JWT_SECRET của Auth Service (>= 32 byte). Giá trị mặc định chỉ dùng cho local.
    secret: ${JWT_SECRET:local-dev-only-secret-change-me-32bytes!}
    issuer: ${JWT_ISSUER:car-sales-auth}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
